# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  postgres:
    image: postgres:16-alpine
    container_name: nppdhanaura-postgres
    restart: unless-stopped
    ports:
      # Host 5432 is often taken by other local stacks (e.g. api-survey-local).
      - "5433:5432"
    environment:
      POSTGRES_USER: nppdhanaura
      POSTGRES_PASSWORD: nppdhanaura
      POSTGRES_DB: nppdhanaura
    volumes:
      - nppdhanaura_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nppdhanaura -d nppdhanaura" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nppdhanaura-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - nppdhanaura_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: nppdhanaura-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # Production-like local stack: docker compose --profile app up --build
  # Uses the same Dockerfiles as production. Leave this profile off for
  # `pnpm dev:api` / `pnpm dev:portal` so ports 3000/4000 stay free.
  api:
    profiles: [ "app" ]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        API_BUILD_ID: local
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://nppdhanaura:nppdhanaura@postgres:5432/nppdhanaura?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      SESSION_COOKIE_NAME: nppdhanaura_session
      API_BUILD_ID: local
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-sikarwar2010@gmail.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-tarun@0446}
      # Omit PAYMENT_PROVIDER=sandbox: NODE_ENV=production rejects sandbox at startup.
      # Auth/session validation does not need a live payment provider.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only: process is up. Use /api/v1/health/ready for ops readiness.
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      default:
        aliases:
          - nppdhanaura-api

  portal:
    profiles: [ "app" ]
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      args:
        API_INTERNAL_URL: http://nppdhanaura-api:4000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_CITIZEN_WEB_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://nppdhanaura-api:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_COOKIE_NAME: nppdhanaura_session
    depends_on:
      api:
        condition: service_healthy

volumes:
  nppdhanaura_pg_data:
  nppdhanaura_redis_data:
